[project]
name = "coding-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jianhong Chen", email = "jjianhongchen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "statsmodels>=0.15.0",
]

[project.scripts]
coding-practice = "coding_practice:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
]
ml = [
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.0",
]
vis = [
    "matplotlib>=3.11.1",
]
